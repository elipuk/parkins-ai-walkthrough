<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #0a0a0f;
  --surface: #161625;
  --accent: #00fff2;
  --text: #e8e8f0;
  --muted: rgba(232, 232, 240, 0.42);
  --border: rgba(255, 255, 255, 0.08);
  --header-h: 52px;
  --bottom-h: 44px;
}

html, body {
  height: 100%; overflow: hidden;
  background: var(--primary); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

/* ── Header (transparent overlay) ─────────────────────────────────────────── */
#header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  display: flex; align-items: center; padding: 0 18px; gap: 14px;
  background: linear-gradient(to bottom, rgba(10,10,15,0.88) 0%, transparent 100%);
  z-index: 20; pointer-events: none;
}
#header > * { pointer-events: all; }

#map-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(10,10,15,0.6);
  backdrop-filter: blur(8px); color: var(--text);
  cursor: pointer; font-size: 1rem; display: flex;
  align-items: center; justify-content: center;
  transition: border-color 0.2s, background 0.2s; flex-shrink: 0;
}
#map-btn:hover { border-color: var(--accent); background: rgba(0,255,242,0.08); }

#wt-title {
  flex: 1; font-size: 0.72rem; font-weight: 600; font-family: 'Orbitron', monospace;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#music-btn {
  background: rgba(10,10,15,0.6); backdrop-filter: blur(8px);
  border: 1px solid var(--border); color: var(--muted);
  padding: 5px 14px; border-radius: 20px; font-size: 0.78rem;
  cursor: pointer; transition: border-color 0.2s, color 0.2s; flex-shrink: 0;
}
#music-btn:hover { border-color: var(--accent); color: var(--text); }
#music-btn.on { border-color: var(--accent); color: var(--accent); }

/* ── Stage — full viewport, perspective container ──────────────────────────── */
#stage {
  position: fixed; inset: 0;
  perspective: 1400px;
  overflow: hidden;
  background-image:
    linear-gradient(rgba(0,255,242,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,242,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ── Panel views — stacked layout (image top ~62%, text bottom) ───────────── */
.panel-view {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  transform-origin: center center;
  will-change: transform, opacity;
  pointer-events: none; opacity: 0;
}
.panel-view.from-right {
  transform: translateX(100px) scale(0.94);
  opacity: 0;
}
.panel-view.from-left {
  transform: translateX(-100px) scale(0.94);
  opacity: 0;
}
.panel-view.to-left {
  transform: translateX(-120px) scale(0.92);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease !important;
}
.panel-view.to-right {
  transform: translateX(120px) scale(0.92);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease !important;
}
.panel-view.settling {
  transition: transform 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.5s ease;
  transform: translateX(0) scale(1);
  opacity: 1;
}
.panel-view.active {
  pointer-events: all; opacity: 1;
  transform: none;
}

/* ── Image section (top ~62%) ─────────────────────────────────────────────── */
.panel-img-section {
  flex: 0 0 62%;
  position: relative;
  overflow: hidden;
  background: #080810;
}

.panel-img-wrap {
  position: absolute; inset: 0;
}
.panel-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0;
  transition: opacity 1s ease 0.4s;
  display: block;
}
.panel-view.settling .panel-img-wrap img,
.panel-view.active .panel-img-wrap img { opacity: 1; }

/* Gradient blending image into text section below */
.panel-img-section::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 110px;
  background: linear-gradient(to bottom, transparent 0%, var(--primary) 100%);
  z-index: 2; pointer-events: none;
}

.panel-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.panel-initials {
  font-size: clamp(80px, 13vw, 160px); font-weight: 800;
  font-family: Georgia, serif; color: rgba(255,255,255,0.04);
  letter-spacing: -0.02em; user-select: none;
}

/* Meta label overlay on image (top-left, below header) */
.panel-meta {
  position: absolute; top: calc(var(--header-h) + 14px); left: 18px;
  font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
  font-family: 'Orbitron', monospace;
  color: var(--accent); opacity: 0;
  transition: opacity 0.45s ease; transition-delay: 0.3s;
  z-index: 3;
}
.panel-view.settling .panel-meta,
.panel-view.active .panel-meta { opacity: 0.65; }

.panel-section-lbl {
  position: absolute; top: calc(var(--header-h) + 36px); left: 18px;
  font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
  font-family: 'Orbitron', monospace;
  color: var(--muted); opacity: 0;
  transition: opacity 0.4s ease; transition-delay: 0.25s;
  z-index: 3;
}
.panel-view.settling .panel-section-lbl,
.panel-view.active .panel-section-lbl { opacity: 1; }

/* Nav arrows overlaid on image sides */
.btn-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.22);
  background: rgba(10,10,15,0.6); backdrop-filter: blur(8px);
  color: var(--text); cursor: pointer; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s, background 0.2s;
  z-index: 5;
}
.btn-nav:hover { border-color: var(--accent); background: rgba(0,255,242,0.12); }
.btn-nav:disabled { opacity: 0.15; cursor: not-allowed; pointer-events: none; }
.btn-prev { left: 14px; }
.btn-next { right: 14px; }

/* ── Text section (bottom ~38%) ───────────────────────────────────────────── */
.panel-text-section {
  flex: 1;
  position: relative;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
  padding: 12px 28px calc(var(--bottom-h) + 70px) 28px;
  background: var(--primary);
}
.panel-text-section::-webkit-scrollbar { display: none; }

.panel-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(16px, 2.8vw, 30px); font-weight: 700; line-height: 1.2;
  color: var(--text); margin-bottom: 6px;
  text-shadow: 0 0 14px rgba(0,255,242,0.5), 0 0 28px rgba(0,255,242,0.15);
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.5s ease, transform 0.5s ease; transition-delay: 0.45s;
}
.panel-view.settling .panel-title,
.panel-view.active .panel-title { opacity: 1; transform: translateY(0); }

.panel-subtitle {
  font-size: 0.85rem; color: var(--accent); opacity: 0; font-weight: 400;
  letter-spacing: 0.02em; margin-bottom: 14px;
  transform: translateY(6px);
  transition: opacity 0.5s ease, transform 0.5s ease; transition-delay: 0.58s;
}
.panel-view.settling .panel-subtitle,
.panel-view.active .panel-subtitle { opacity: 0.75; transform: translateY(0); }

.panel-text { font-size: 0.98rem; line-height: 1.78; }

.sentence {
  opacity: 0; display: inline;
  transition: opacity 0.55s ease;
}
.sentence.visible { opacity: 0.82; }

/* ── Read more — floating bottom-left ────────────────────────────────────── */
.btn-readmore {
  position: absolute;
  bottom: calc(var(--bottom-h) + 14px); left: 18px; z-index: 6;
  padding: 9px 20px;
  background: rgba(10,10,15,0.8); backdrop-filter: blur(10px);
  border: 1px solid var(--accent); color: var(--accent);
  border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
  letter-spacing: 0.02em;
  box-shadow: 0 0 12px rgba(0,255,242,0.15);
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
}
.btn-readmore:hover { background: var(--accent); color: var(--primary); box-shadow: 0 0 20px rgba(0,255,242,0.4); }

/* ── Bottom bar — narration progress ─────────────────────────────────────── */
#bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--bottom-h); z-index: 22;
  background: linear-gradient(to top, rgba(10,10,15,0.9) 0%, transparent 100%);
  display: flex; flex-direction: column; justify-content: flex-end;
  pointer-events: none;
}
#nar-track {
  height: 3px; background: rgba(255,255,255,0.06);
  position: relative; overflow: hidden; flex-shrink: 0;
}
#nar-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--accent); width: 0%;
  box-shadow: 0 0 8px rgba(0,255,242,0.6);
  transition: width 0.4s linear;
}
#bottom-inner {
  height: calc(var(--bottom-h) - 2px);
  display: flex; align-items: center; padding: 0 18px;
  pointer-events: all;
}
#nar-label {
  font-size: 0.7rem; color: var(--muted); letter-spacing: 0.06em; flex: 1;
}

/* ── Continue button ─────────────────────────────────────────────────────── */
#continue-btn {
  position: fixed; bottom: calc(var(--bottom-h) + 16px); left: 50%;
  transform: translateX(-50%);
  padding: 11px 34px;
  border: 1px solid rgba(0, 255, 242, 0.45);
  background: rgba(10, 10, 15, 0.75); backdrop-filter: blur(10px);
  color: var(--accent); border-radius: 4px; font-size: 0.88rem;
  font-family: 'Orbitron', monospace;
  font-weight: 500; letter-spacing: 0.06em; cursor: pointer;
  opacity: 0; pointer-events: none;
  box-shadow: 0 0 12px rgba(0,255,242,0.15);
  transition: opacity 0.5s ease, border-color 0.2s, background 0.2s, box-shadow 0.2s;
  z-index: 25;
  animation: pulse-glow 2.4s ease-in-out infinite;
}
#continue-btn.visible { opacity: 1; pointer-events: all; }
#continue-btn:hover {
  background: rgba(0, 255, 242, 0.12); border-color: var(--accent);
  box-shadow: 0 0 24px rgba(0,255,242,0.4);
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 12px rgba(0,255,242,0.15), 0 0 0 0 rgba(0, 255, 242, 0.25); }
  50%       { box-shadow: 0 0 12px rgba(0,255,242,0.15), 0 0 0 10px rgba(0, 255, 242, 0); }
}

/* ── Sidebar (floating overlay) ─────────────────────────────────────────── */
#sidebar-back {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.45);
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s ease;
}
#sidebar-back.open { opacity: 1; pointer-events: all; }

#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 300px;
  z-index: 50; background: rgba(10, 10, 15, 0.96);
  backdrop-filter: blur(16px);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
}
#sidebar.open { transform: translateX(0); }

#sidebar-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
#sidebar-wt-title {
  flex: 1; font-size: 0.78rem; font-weight: 600; font-family: 'Orbitron', monospace;
  color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#sidebar-close {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s, color 0.2s;
}
#sidebar-close:hover { border-color: var(--accent); color: var(--text); }

#sidebar-home {
  display: block; flex-shrink: 0; padding: 12px 20px;
  font-size: 0.8rem; color: var(--muted); text-decoration: none;
  border-bottom: 1px solid var(--border);
  transition: color 0.2s, background 0.15s;
}
#sidebar-home:hover { color: var(--accent); background: rgba(255,255,255,0.04); }

#nav-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 16px; }
#nav-list::-webkit-scrollbar { width: 3px; }
#nav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.section-heading {
  padding: 18px 20px 8px;
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}

.nav-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 20px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}
.nav-item:hover { background: rgba(255,255,255,0.03); }
.nav-item.active { border-left-color: var(--accent); background: rgba(255,255,255,0.04); }
.nav-num { font-size: 0.65rem; font-family: 'Orbitron', monospace; color: var(--muted); padding-top: 3px; flex-shrink: 0; min-width: 20px; }
.nav-title-wrap .nav-title { font-size: 0.88rem; line-height: 1.35; color: var(--text); }
.nav-item.active .nav-title { color: var(--accent); }
.nav-title-wrap .nav-sub { font-size: 0.7rem; color: var(--muted); margin-top: 2px; line-height: 1.3; }

/* ── Article drawer ─────────────────────────────────────────────────────── */
#drawer { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#drawer-back {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.55); opacity: 0; transition: opacity 0.3s;
}
#drawer-sheet {
  position: absolute; bottom: 0; left: 0; right: 0; height: 88vh;
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 14px 14px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
#drawer.open { pointer-events: all; }
#drawer.open #drawer-back { opacity: 1; }
#drawer.open #drawer-sheet { transform: translateY(0); }

#drawer-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
}
#drawer-head {
  padding: 14px 28px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; flex-shrink: 0;
}
#drawer-title { flex: 1; font-family: Georgia, serif; font-size: 1.1rem; font-weight: 600; }
#drawer-close {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: transparent;
  color: var(--text); cursor: pointer; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s;
}
#drawer-close:hover { border-color: var(--accent); }
#drawer-scroll { flex: 1; overflow-y: auto; padding: 28px 32px 40px; }
#drawer-scroll::-webkit-scrollbar { width: 6px; }
#drawer-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

#drawer-article { max-width: 700px; margin: 0 auto; font-size: 1rem; line-height: 1.82; color: rgba(232,232,240,0.82); }
#drawer-article h1 { font-family: Georgia, serif; font-size: 1.75rem; font-weight: 700; color: var(--text); line-height: 1.2; margin: 0 0 20px; }
#drawer-article h2 { font-family: Georgia, serif; font-size: 1.2rem; font-weight: 600; color: var(--text); margin: 28px 0 10px; }
#drawer-article h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin: 20px 0 8px; }
#drawer-article p { margin-bottom: 1.1em; }
#drawer-article strong { color: var(--text); font-weight: 600; }
#drawer-article em { font-style: italic; opacity: 0.92; }
#drawer-article code { font-family: monospace; font-size: 0.9em; opacity: 0.8; }
#drawer-article ul, #drawer-article ol { padding-left: 1.4em; margin-bottom: 1.1em; }
#drawer-article li { margin-bottom: 0.35em; }
#drawer-article hr { border: none; border-top: 1px solid var(--border); margin: 1.8em 0; }
#drawer-article blockquote {
  border-left: 3px solid var(--accent); padding-left: 1em;
  margin: 1.2em 0; color: rgba(232,232,240,0.6); font-style: italic;
}

/* ── Loading & error ────────────────────────────────────────────────────── */
#loading {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  background: var(--primary); z-index: 100; transition: opacity 0.4s;
}
#loading.gone { opacity: 0; pointer-events: none; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-lbl { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

#error-view { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px; text-align: center; }
#error-view.show { display: flex; }
#error-view h2 { font-family: Georgia, serif; font-size: 1.5rem; }
#error-view p { color: var(--muted); font-size: 0.9rem; max-width: 380px; line-height: 1.6; }

/* ── Menu (root URL) ─────────────────────────────────────────────────────── */
#menu-view {
  position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
  background: var(--primary); z-index: 90;
  display: none; flex-direction: column;
  padding: 72px 40px 60px;
}
#menu-view.show { display: flex; }
#menu-header-inner { max-width: 900px; margin: 0 auto 52px; }
#menu-logo {
  font-family: 'Orbitron', monospace; font-size: 0.65rem;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); opacity: 0.55; margin-bottom: 16px;
}
#menu-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(28px, 4vw, 52px); font-weight: 700;
  color: var(--text); line-height: 1.1;
  text-shadow: 0 0 24px rgba(0,255,242,0.4);
}
#menu-grid {
  max-width: 900px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.menu-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; cursor: pointer;
  text-decoration: none; color: inherit;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  display: block;
}
.menu-card:hover {
  border-color: var(--accent); transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(0,255,242,0.12);
}
.menu-card-cover {
  height: 160px; overflow: hidden; background: #080810;
  position: relative;
}
.menu-card-cover img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  position: relative; z-index: 1;
}
.menu-card-cover-ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px; font-weight: 800; font-family: Georgia, serif;
  color: rgba(255,255,255,0.05); user-select: none;
}
.menu-card-body { padding: 18px 20px 20px; }
.menu-card-title {
  font-family: 'Orbitron', monospace; font-size: 0.84rem;
  font-weight: 600; letter-spacing: 0.04em;
  color: var(--text); margin-bottom: 8px;
}
.menu-card-desc {
  font-size: 0.82rem; line-height: 1.55;
  color: var(--muted); margin-bottom: 12px;
}
.menu-card-meta {
  font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
  font-family: 'Orbitron', monospace; color: var(--accent); opacity: 0.65;
}

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 540px) {
  #menu-view { padding: 56px 14px 40px; overflow-x: hidden; }
  #menu-grid { grid-template-columns: 1fr; gap: 14px; }
  .panel-text-section { padding: 10px 18px calc(var(--bottom-h) + 70px) 18px; }
  .btn-readmore { left: 14px; }
  .btn-nav { width: 34px; height: 34px; font-size: 0.95rem; }
}
@media (max-width: 720px) {
  #sidebar { width: 85vw; max-width: 320px; }
  #drawer-scroll { padding: 20px 20px 32px; }
}

/* ── Desktop / landscape: side-by-side split layout ───────────────────────────
   The portrait-first stack crops hard when the image box goes short-and-wide on
   desktop. Above a landscape breakpoint we lay image and text side by side and
   switch the image to `contain` so the whole picture shows, uncropped. Mobile
   portrait and cast (a separately baked file) are unaffected. */
@media (min-width: 900px) and (orientation: landscape) {
  .panel-view { flex-direction: row; }
  .panel-img-section { flex: 0 0 56%; height: 100%; }
  .panel-img-wrap img { object-fit: contain; }
  /* No text sits below the image in split mode — drop the bottom blend fade. */
  .panel-img-section::after { display: none; }
  .panel-text-section {
    flex: 1;
    padding: clamp(40px, 9vh, 96px) 52px calc(var(--bottom-h) + 48px) 52px;
  }
  .panel-text-section > * { max-width: 620px; }
  .panel-title { font-size: clamp(26px, 2.6vw, 38px); }

/* ── Offline / save button ─────────────────────────────────────────────────── */

/* ── Carousel (multi-image panels) ─────────────────────────────────────────── */
.carousel-track {

}
.carousel-track .panel-img-wrap {

/* ── Narration controls ─────────────────────────────────────────────────────── */

/* ── Resume-position prompt ─────────────────────────────────────────────────── */
#resume-prompt {

}
#resume-prompt.visible { opacity: 1; pointer-events: all; }
#resume-yes, #resume-no {

<script>
'use strict';

// Defined first so the async Cast SDK can call it after page load, by which
// point all our functions are in scope.
window['__onGCastApiAvailable'] = function(ok) { if (ok) initCastApi(); };

// ── Markdown renderer ──────────────────────────────────────────────────────
function renderMd(md) {
  const lines = md.split('\n');
  const out = [];
  let inUl = false;
  function closeList() { if (inUl) { out.push('</ul>'); inUl = false; } }
  for (const raw of lines) {
    const line = raw.trimEnd();
    if      (line.startsWith('### ')) { closeList(); out.push('<h3>' + inl(line.slice(4)) + '</h3>'); continue; }
    else if (line.startsWith('## '))  { closeList(); out.push('<h2>' + inl(line.slice(3)) + '</h2>'); continue; }
    else if (line.startsWith('# '))   { closeList(); out.push('<h1>' + inl(line.slice(2)) + '</h1>'); continue; }
    else if (line.trim() === '---')   { closeList(); out.push('<hr>'); continue; }
    else if (line.startsWith('> '))   { closeList(); out.push('<blockquote>' + inl(line.slice(2)) + '</blockquote>'); continue; }
    else if (line.startsWith('- ') || line.startsWith('* ')) {
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push('<li>' + inl(line.slice(2)) + '</li>');
      continue;
    }
    closeList();
    if (line.trim() === '') continue;
    out.push('<p>' + inl(line) + '</p>');
  }
  closeList();
  return out.join('\n');
}

function inl(t) {
  return t
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Sentence splitter ──────────────────────────────────────────────────────
function splitSentences(text) {
  const raw = text.match(/[^.!?…]+[.!?…]+\s*/g) || [text];
  return raw.map(s => s.trimEnd()).filter(Boolean);
}

// ── Placeholder palettes ───────────────────────────────────────────────────
const PALETTES = [
  ['#070d1e', '#0e2244'], ['#140820', '#2d1250'],
  ['#061a12', '#0e3826'], ['#0c1418', '#172635'],
  ['#180a07', '#381810'],
];
function mkPlaceholder(idx, title) {
  const [c1, c2] = PALETTES[idx % PALETTES.length];
  const initials = title.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
  return { bg: 'linear-gradient(140deg,' + c1 + ' 0%,' + c2 + ' 100%)', initials };
}

// ── Theme ──────────────────────────────────────────────────────────────────
function applyTheme(t) {
  if (!t) return;
  const r = document.documentElement;
  if (t.primary) r.style.setProperty('--primary', t.primary);
  if (t.accent)  r.style.setProperty('--accent',  t.accent);
  if (t.text)    r.style.setProperty('--text',    t.text);
  if (t.primary) r.style.setProperty('--surface', lighten(t.primary, 12));
}
function lighten(hex, a) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const n = parseInt(hex, 16);
  const r = Math.min(255, (n >> 16) + a);
  const g = Math.min(255, ((n >> 8) & 0xff) + a);
  const b = Math.min(255, (n & 0xff) + a);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

// ── Section lookup ─────────────────────────────────────────────────────────
let sectionByPanelId = {};
function buildSectionIndex() {
  sectionByPanelId = {};
  if (!manifest.sections) return;
  for (const sec of manifest.sections) {
    for (const pid of (sec.panels || [])) {
      sectionByPanelId[pid] = sec.title;
    }
  }
}

// ── State ──────────────────────────────────────────────────────────────────
let manifest = null, currentIdx = -1, musicOn = false, wid = '', narPaused = false;
let navigating = false;
let resumeTarget = 0, resumeDismissTimer = null;
let drawerOpen = false;
let castSession = null, castPlayer = null, castCtrl = null;
let castAvailable = false, castMediaHad = false, castHolding = false;
let castContinueTimer = null;
const panelCache = {}, articleCache = {};

// ── DOM ────────────────────────────────────────────────────────────────────
const $loading    = document.getElementById('loading');
const $errView    = document.getElementById('error-view');
const $errMsg     = document.getElementById('error-msg');
const $wtTitle    = document.getElementById('wt-title');
const $stage      = document.getElementById('stage');
const $narFill    = document.getElementById('nar-fill');
const $narLabel   = document.getElementById('nar-label');
const $continuBtn = document.getElementById('continue-btn');
const $drawer     = document.getElementById('drawer');
const $dTitle     = document.getElementById('drawer-title');
const $dArt       = document.getElementById('drawer-article');
const $dClose     = document.getElementById('drawer-close');
const $dBack      = document.getElementById('drawer-back');
const $musicBtn   = document.getElementById('music-btn');
const $castBtn    = document.getElementById('cast-btn');
const $offlineBtn = document.getElementById('offline-btn');
const $mapBtn     = document.getElementById('map-btn');
const $sidebar    = document.getElementById('sidebar');
const $sbBack     = document.getElementById('sidebar-back');
const $sbClose    = document.getElementById('sidebar-close');
const $sbTitle    = document.getElementById('sidebar-wt-title');
const $navList    = document.getElementById('nav-list');
const narEl          = document.getElementById('nar-el');
const musEl          = document.getElementById('mus-el');
const $narPauseBtn   = document.getElementById('nar-pause-btn');
const $narRestartBtn = document.getElementById('nar-restart-btn');
const $resumePrompt  = document.getElementById('resume-prompt');
const $resumeMsg     = document.getElementById('resume-msg');
const $resumeYes     = document.getElementById('resume-yes');
const $resumeNo      = document.getElementById('resume-no');

// ── Sidebar ────────────────────────────────────────────────────────────────
function openSidebar()  { $sidebar.classList.add('open'); $sbBack.classList.add('open'); }
function closeSidebar() { $sidebar.classList.remove('open'); $sbBack.classList.remove('open'); }

$mapBtn.addEventListener('click', openSidebar);
$sbClose.addEventListener('click', closeSidebar);
$sbBack.addEventListener('click', closeSidebar);

function renderNav() {
  const panels = manifest.panels;
  const hasSections = manifest.sections && manifest.sections.length;

  if (hasSections) {
    let html = '';
    for (const sec of manifest.sections) {
      html += '<div class="section-heading">' + esc(sec.title) + '</div>';
      for (const pid of sec.panels) {
        const i = panels.findIndex(p => p.id === pid);
        if (i < 0) continue;
        const p = panels[i];
        const active = i === currentIdx ? ' active' : '';
        const num = String(i + 1).padStart(2, '0');
        const sub = p.subtitle ? p.subtitle.split('·')[0].trim() : '';
        html += '<div class="nav-item' + active + '" data-i="' + i + '">' +
          '<span class="nav-num">' + num + '</span>' +
          '<div class="nav-title-wrap"><div class="nav-title">' + esc(p.title) + '</div>' +
          (sub ? '<div class="nav-sub">' + esc(sub) + '</div>' : '') +
          '</div></div>';
      }
    }
    $navList.innerHTML = html;
  } else {
    $navList.innerHTML = panels.map(function(p, i) {
      const active = i === currentIdx ? ' active' : '';
      const num = String(i + 1).padStart(2, '0');
      const sub = p.subtitle ? p.subtitle.split('·')[0].trim() : '';
      return '<div class="nav-item' + active + '" data-i="' + i + '">' +
        '<span class="nav-num">' + num + '</span>' +
        '<div class="nav-title-wrap"><div class="nav-title">' + esc(p.title) + '</div>' +
        (sub ? '<div class="nav-sub">' + esc(sub) + '</div>' : '') +
        '</div></div>';
    }).join('');
  }

  $navList.querySelectorAll('.nav-item').forEach(function(el) {
    el.addEventListener('click', function() {
      const i = parseInt(el.dataset.i, 10);
      closeSidebar();
      if (i !== currentIdx) goToPanel(i);
    });
  });
}

// ── Load panel data ────────────────────────────────────────────────────────
async function loadPanel(i) {
  if (panelCache[i]) return panelCache[i];
  try {
    const res = await fetch('/api/walkthroughs/' + wid + '/panels/' + manifest.panels[i].id);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    panelCache[i] = await res.json();
  } catch(e) {
    panelCache[i] = manifest.panels[i];
  }
  return panelCache[i];
}

// ── Service worker & offline ───────────────────────────────────────────────
// Matches CACHE_NAME in sw.js — must be kept in sync when bumping the SW version.
const CACHE_NAME = 'walkthrough-v3';
let offlineState = 'idle'; // idle | saving | saved

function setOfflineState(state) {
  offlineState = state;
  if (!$offlineBtn) return;
  $offlineBtn.className = state;
  if (state === 'idle') $offlineBtn.textContent = '⬇ Save';
  if (state === 'saved') $offlineBtn.textContent = '✓ Offline';
}

async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('/sw.js');
  } catch(e) {
    console.warn('SW registration failed:', e);
    return;
  }
  navigator.serviceWorker.addEventListener('message', function(event) {
    const d = event.data;
    if (!d || d.type !== 'PRECACHE_PROGRESS') return;
    if (d.complete) {
      setOfflineState('saved');
    } else {
      if ($offlineBtn) $offlineBtn.textContent = '⋯ ' + d.done + '/' + d.total;
    }
  });
}

async function checkWalkthroughCached(id) {
  if (!('caches' in window)) return false;
  try {
    const cache = await caches.open(CACHE_NAME);
    return !!(await cache.match('/api/walkthroughs/' + id, { ignoreVary: true }));
  } catch { return false; }
}

async function initOfflineBtn(id) {
  if (!('serviceWorker' in navigator) || !$offlineBtn) return;
  $offlineBtn.style.display = '';
  const isCached = await checkWalkthroughCached(id);
  setOfflineState(isCached ? 'saved' : 'idle');

  $offlineBtn.addEventListener('click', function() {
    if (offlineState !== 'idle') return;
    const sw = navigator.serviceWorker.controller;
    if (!sw) {
      // SW installed but not yet controlling — prompt user to refresh
      $offlineBtn.textContent = 'Refresh ↺';
      setTimeout(function() { setOfflineState('idle'); }, 2000);
      return;
    }
    setOfflineState('saving');
    $offlineBtn.textContent = '⋯ 0/' + manifest.panels.length;
    sw.postMessage({ type: 'PRECACHE_WALKTHROUGH', walkthroughId: id, manifest: manifest });
  });
}

// ── Image retry with exponential backoff ───────────────────────────────────
const imgOnlineCallbacks = new Set();
window.addEventListener('online', function() {
  Array.from(imgOnlineCallbacks).forEach(function(cb) { cb(); });
});

function loadImgWithRetry(src, alt, wrap) {
  const MAX_RETRIES = 4;
  let retryCount = 0;
  let backoffId = null;
  let done = false;
  const ph = wrap.querySelector('.panel-placeholder');

  if (ph) ph.classList.add('img-loading');

  function cleanup() {
    done = true;
    imgOnlineCallbacks.delete(onOnline);
    if (backoffId) { clearTimeout(backoffId); backoffId = null; }
  }

  function onOnline() {
    if (done) return;
    if (!wrap.isConnected) { cleanup(); return; }
    if (backoffId) { clearTimeout(backoffId); backoffId = null; }
    attempt();
  }

  function attempt() {
    if (done) { cleanup(); return; }
    const img = new Image();
    img.alt = alt;
    img.onload = function() {
      if (done) return;
      cleanup();
      if (ph) ph.classList.remove('img-loading');
      if (wrap.isConnected) wrap.insertBefore(img, wrap.firstChild);
    };
    img.onerror = function() {
      if (done || !wrap.isConnected) { cleanup(); return; }
      retryCount++;
      if (retryCount >= MAX_RETRIES) {
        cleanup();
        if (ph) { ph.classList.remove('img-loading'); ph.classList.add('img-failed'); }
        return;
      }
      const delay = Math.min(1000 * Math.pow(2, retryCount - 1), 16000);
      backoffId = setTimeout(attempt, delay);
    };
    img.src = src;
  }

  imgOnlineCallbacks.add(onOnline);
  attempt();
}

// ── Build panel DOM ────────────────────────────────────────────────────────
function buildPanel(i, data) {
  const ph = mkPlaceholder(i, data.title);
  const total = manifest.panels.length;
  const panelId = manifest.panels[i].id;
  const num = String(i + 1).padStart(2, '0');
  const sectionLbl = sectionByPanelId[panelId] || '';
  const sentences = splitSentences(data.body || '');

  // Prefer data.images array; fall back to single data.image for existing panels
  const imageList = (data.images && data.images.length > 0)
    ? data.images
    : (data.image ? [data.image] : []);
  const isCarousel = imageList.length > 1;

  const el = document.createElement('div');
  el.className = 'panel-view';

  const sentenceHtml = sentences.map(function(s, si) {
    return '<span class="sentence" data-si="' + si + '">' + esc(s) + ' </span>';
  }).join('');

  const phHtml = '<div class="panel-placeholder"><div class="panel-initials">' + esc(ph.initials) + '</div></div>';
  let imgContent;
  if (isCarousel) {
    imgContent =
      '<div class="carousel-track">' +
        imageList.map(function(_, ci) { return '<div class="panel-img-wrap' + (ci === 0 ? ' cur' : '') + '">' + phHtml + '</div>'; }).join('') +
      '</div>' +
      '<div class="carousel-dots">' +
        imageList.map(function(_, ci) {
          return '<span class="carousel-dot' + (ci === 0 ? ' active' : '') + '" data-ci="' + ci + '"></span>';
        }).join('') +
      '</div>';
  } else {
    imgContent = '<div class="panel-img-wrap">' + phHtml + '</div>';
  }

  el.innerHTML =
    '<div class="panel-img-section" style="background:' + ph.bg + '">' +
      imgContent +
      (sectionLbl ? '<div class="panel-section-lbl">' + esc(sectionLbl) + '</div>' : '') +
      '<div class="panel-meta">Panel ' + num + ' of ' + total + '</div>' +
      '<button class="btn-nav btn-prev"' + (i === 0 ? ' disabled' : '') + '>←</button>' +
      '<button class="btn-nav btn-next"' + (i === total - 1 ? ' disabled' : '') + '>→</button>' +
    '</div>' +
    '<div class="panel-text-section">' +
      '<h1 class="panel-title">' + esc(data.title) + '</h1>' +
      '<div class="panel-subtitle">' + esc(data.subtitle || '') + '</div>' +
      '<div class="panel-text">' + sentenceHtml + '</div>' +
    '</div>' +
    '<button class="btn-readmore">Read more</button>';

  // Load images with retry/backoff
  if (isCarousel) {
    const wraps = el.querySelectorAll('.carousel-track .panel-img-wrap');
    imageList.forEach(function(img, ci) {
      loadImgWithRetry(
        '/api/walkthroughs/' + wid + '/asset/' + panelId + '/' + img,
        data.title + ' · ' + (ci + 1),
        wraps[ci]
      );
    });
    initCarousel(el, imageList.length);
  } else if (imageList.length === 1) {
    loadImgWithRetry(
      '/api/walkthroughs/' + wid + '/asset/' + panelId + '/' + imageList[0],
      data.title,
      el.querySelector('.panel-img-wrap')
    );
  }

  el.querySelector('.btn-readmore').addEventListener('click', function() { openArticle(i, data.title); });
  el.querySelector('.btn-prev').addEventListener('click', function() { goToPanel(currentIdx - 1); });
  el.querySelector('.btn-next').addEventListener('click', function() { goToPanel(currentIdx + 1); });

  return el;
}

// ── Carousel ───────────────────────────────────────────────────────────────
function initCarousel(panelEl, count) {
  let ci = 0;
  const wraps = panelEl.querySelectorAll('.carousel-track .panel-img-wrap');
  const dots  = panelEl.querySelectorAll('.carousel-dot');
  let autoTimer = null;

  function goCarousel(idx) {
    ci = ((idx % count) + count) % count;
    wraps.forEach(function(w, j) { w.classList.toggle('cur', j === ci); });
    dots.forEach(function(d, j) { d.classList.toggle('active', j === ci); });
  }

  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  // Auto-revolve every 5s while this panel is on screen; the first manual
  // interaction cancels it so auto-advance never fights the viewer.
  autoTimer = setInterval(function() {
    if (panelEl.classList.contains('active')) goCarousel(ci + 1);
  }, 5000);

  dots.forEach(function(dot) {
    dot.addEventListener('click', function(e) {
      e.stopPropagation();
      stopAuto();
      goCarousel(parseInt(dot.dataset.ci, 10));
    });
  });

  // Horizontal swipe to advance carousel; vertical swipe passes through
  let tx = 0, ty = 0;
  const imgSec = panelEl.querySelector('.panel-img-section');
  imgSec.addEventListener('touchstart', function(e) {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, { passive: true });
  imgSec.addEventListener('touchend', function(e) {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 44) {
      stopAuto();
      goCarousel(ci + (dx < 0 ? 1 : -1));
    }
  }, { passive: true });
}

// ── Narration & text sync ──────────────────────────────────────────────────
let narTimeTimer = null;

function stopNarration() {
  narEl.pause();
  narEl.ontimeupdate = null;
  narEl.onended = null;
  narEl.onloadedmetadata = null;
  if (narTimeTimer) { clearInterval(narTimeTimer); narTimeTimer = null; }
  if (castContinueTimer) { clearTimeout(castContinueTimer); castContinueTimer = null; }
  $narFill.style.transition = 'none';
  $narFill.style.width = '0%';
  $narLabel.textContent = '';
  hideContinue();
  narPaused = false;
  $narPauseBtn.textContent = '⏸';
  $narPauseBtn.style.display = 'none';
  $narRestartBtn.style.display = 'none';
}

function showContinue() {
  $continuBtn.classList.add('visible');
}
function hideContinue() {
  $continuBtn.classList.remove('visible');
}

function revealSentences(panelView, fraction) {
  const sents = panelView.querySelectorAll('.sentence');
  const n = sents.length;
  let lastRevealed = null;
  sents.forEach(function(s, i) {
    if (fraction >= i / n) {
      s.classList.add('visible');
      lastRevealed = s;
    }
  });
  // Auto-scroll text section to keep latest sentence visible
  if (lastRevealed) {
    const textSection = panelView.querySelector('.panel-text-section');
    if (textSection) {
      const sBottom = lastRevealed.getBoundingClientRect().bottom;
      const tBottom = textSection.getBoundingClientRect().bottom;
      if (sBottom > tBottom - 28) {
        textSection.scrollTop += sBottom - tBottom + 44;
      }
    }
  }
}

function startTextStagger(panelView) {
  const sents = panelView.querySelectorAll('.sentence');
  sents.forEach(function(s, i) {
    setTimeout(function() { s.classList.add('visible'); }, 900 + i * 420);
  });
  // Show continue after last sentence + 2s
  const totalDelay = 900 + sents.length * 420 + 2000;
  setTimeout(function() {
    if ($stage.contains(panelView) && panelView.classList.contains('active')) {
      showContinue();
    }
  }, totalDelay);
}

function playNarration(panelView, i, data, startPaused) {
  stopNarration();
  $narLabel.textContent = data.title || '';

  // When a cast session is active, TV is the audio source — don't play locally.
  if (castSession) {
    if (data.narration) {
      narPaused = false;
      $narPauseBtn.textContent = '⏸';
      $narPauseBtn.style.display = '';
      $narRestartBtn.style.display = '';
    } else {
      // No narration → image held on TV; show Continue promptly
      setTimeout(showContinue, 800);
    }
    startTextStagger(panelView);
    return;
  }

  if (!data.narration) {
    startTextStagger(panelView);
    return;
  }

  narEl.src = '/api/walkthroughs/' + wid + '/asset/' + manifest.panels[i].id + '/' + data.narration;
  narPaused = !!startPaused;
  $narPauseBtn.textContent = startPaused ? '▶' : '⏸';
  $narPauseBtn.style.display = '';
  $narRestartBtn.style.display = '';

  function syncProgress() {
    if (!narEl.duration) return;
    const pct = narEl.currentTime / narEl.duration;
    $narFill.style.transition = 'width 0.35s linear';
    $narFill.style.width = (pct * 100) + '%';
    revealSentences(panelView, pct);
  }

  narEl.onended = function() {
    $narFill.style.transition = 'width 0.4s ease';
    $narFill.style.width = '100%';
    revealSentences(panelView, 1);
    setTimeout(showContinue, 600);
  };

  narEl.ontimeupdate = syncProgress;

  // Returning from a cast session: load the audio but stay paused at the start,
  // text fully revealed, so the viewer can resume on the phone if they want.
  if (startPaused) {
    narEl.onloadedmetadata = null;
    revealSentences(panelView, 1);
    return;
  }

  // If duration known from panel data, show sentences immediately at t=0
  if (data.narration_duration) {
    narEl.onloadedmetadata = null;
    narEl.play().catch(function() {
      // Autoplay blocked: fall back to stagger
      narEl.ontimeupdate = null;
      startTextStagger(panelView);
    });
  } else {
    narEl.onloadedmetadata = function() {
      narEl.play().catch(function() {
        narEl.ontimeupdate = null;
        startTextStagger(panelView);
      });
    };
  }
}

// ── Navigate ───────────────────────────────────────────────────────────────
async function goToPanel(i) {
  if (!manifest || i < 0 || i >= manifest.panels.length || navigating) return;
  navigating = true;
  hideContinue();

  const forward = i > currentIdx;
  const data = await loadPanel(i);
  const panelView = buildPanel(i, data);

  // Set initial (off-screen) state before appending
  panelView.classList.add(forward ? 'from-right' : 'from-left');
  $stage.appendChild(panelView);

  // Animate out the current panel
  const prev = $stage.querySelector('.panel-view.active');
  if (prev) {
    prev.classList.remove('active');
    prev.classList.add(forward ? 'to-left' : 'to-right');
    setTimeout(function() { prev.remove(); }, 550);
  }

  // Force reflow then animate in
  panelView.offsetWidth;
  panelView.classList.remove('from-right', 'from-left');
  panelView.classList.add('settling');

  // After the settling transition, mark active for ongoing state
  setTimeout(function() {
    panelView.classList.remove('settling');
    panelView.classList.add('active');
    navigating = false;
  }, 700);

  currentIdx = i;
  savePosition(i);
  renderNav();
  playNarration(panelView, i, data);
  if (castSession) castPanel(i, data); // drive TV when casting

  // Prefetch neighbours
  if (i + 1 < manifest.panels.length) loadPanel(i + 1).catch(function(){});
  if (i > 0) loadPanel(i - 1).catch(function(){});
}

// ── Reading-position persistence ──────────────────────────────────────────
function savePosition(idx) {
  if (!wid) return;
  try { localStorage.setItem('wt-pos-' + wid, String(idx)); } catch(e) {}
}

function getSavedPosition() {
  try { return parseInt(localStorage.getItem('wt-pos-' + wid) || '0', 10) || 0; } catch(e) { return 0; }
}

// ── Continue button ────────────────────────────────────────────────────────
$continuBtn.addEventListener('click', function() {
  hideContinue();
  if (currentIdx + 1 < manifest.panels.length) {
    goToPanel(currentIdx + 1);
  }
});

// ── Article drawer ─────────────────────────────────────────────────────────
async function openArticle(i, title) {
  $dTitle.textContent = title;
  $dArt.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0">Loading…</p>';
  $drawer.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (!drawerOpen) { drawerOpen = true; history.pushState({ drawer: true }, ''); }

  if (articleCache[i]) { $dArt.innerHTML = renderMd(articleCache[i]); return; }

  try {
    const res = await fetch('/api/walkthroughs/' + wid + '/article/' + manifest.panels[i].id);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    articleCache[i] = text;
    $dArt.innerHTML = renderMd(text);
  } catch(e) {
    $dArt.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0">Article not available.</p>';
  }
}

function closeDrawer() { $drawer.classList.remove('open'); document.body.style.overflow = ''; drawerOpen = false; }
// User-initiated close walks history back so the entry pushed on open is
// consumed (popstate then does the visual close). Falls back to a direct
// close if no drawer history entry is present.
function dismissDrawer() {
  if (drawerOpen && history.state && history.state.drawer) { history.back(); }
  else { closeDrawer(); }
}
$dClose.addEventListener('click', dismissDrawer);
$dBack.addEventListener('click', dismissDrawer);
window.addEventListener('popstate', function() { if (drawerOpen) closeDrawer(); });

// ── Music ──────────────────────────────────────────────────────────────────
function setupMusic() {
  if (!manifest.music) return;
  $musicBtn.style.display = '';
  musEl.src = '/api/walkthroughs/' + wid + '/music';
  musEl.volume = 0.12;
  $musicBtn.addEventListener('click', function() {
    if (musicOn) {
      musEl.pause(); musicOn = false;
      $musicBtn.textContent = '♪ Music'; $musicBtn.classList.remove('on');
    } else {
      musEl.play().then(function() {
        musicOn = true; $musicBtn.textContent = '♪ On'; $musicBtn.classList.add('on');
      }).catch(function(){});
    }
  });
}

// ── Keyboard ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if ($drawer.classList.contains('open')) { if (e.key === 'Escape') dismissDrawer(); return; }
  if ($sidebar.classList.contains('open')) { if (e.key === 'Escape') closeSidebar(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    hideContinue();
    goToPanel(currentIdx + 1);
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    hideContinue();
    goToPanel(currentIdx - 1);
  }
  if (e.key === 'Escape') closeSidebar();
  if (e.key === 'm' || e.key === 'M') $musicBtn.click();
});

// ── Narration controls ─────────────────────────────────────────────────────
$narPauseBtn.addEventListener('click', function() {
  if (castCtrl && castPlayer) {
    castCtrl.playOrPause();
    // isPaused flips after playOrPause; read it after a tick
    setTimeout(function() {
      narPaused = castPlayer.isPaused;
      $narPauseBtn.textContent = narPaused ? '▶' : '⏸';
    }, 80);
    return;
  }
  if (narEl.paused) {
    narEl.play().catch(function(){});
    narPaused = false;
    $narPauseBtn.textContent = '⏸';
  } else {
    narEl.pause();
    narPaused = true;
    $narPauseBtn.textContent = '▶';
  }
});

$narRestartBtn.addEventListener('click', function() {
  const pv = $stage.querySelector('.panel-view.active, .panel-view.settling');
  function resetSentences() {
    if (!pv) return;
    pv.querySelectorAll('.sentence').forEach(function(s) { s.classList.remove('visible'); });
    const ts = pv.querySelector('.panel-text-section');
    if (ts) ts.scrollTop = 0;
  }
  if (castCtrl && castPlayer) {
    castPlayer.currentTime = 0;
    castCtrl.seek();
    narPaused = false;
    $narPauseBtn.textContent = '⏸';
    hideContinue();
    resetSentences();
    return;
  }
  if (!narEl.src) return;
  resetSentences();
  narEl.currentTime = 0;
  narPaused = false;
  $narPauseBtn.textContent = '⏸';
  narEl.play().catch(function(){});
  hideContinue();
});

// ── Menu (root URL) ────────────────────────────────────────────────────────
const $menuView = document.getElementById('menu-view');
const $menuGrid = document.getElementById('menu-grid');

async function showMenu() {
  document.title = 'Walkthroughs';
  try {
    const res = await fetch('/api/walkthroughs');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const walkthroughs = await res.json();
    $menuGrid.innerHTML = walkthroughs.length ? walkthroughs.map(function(wt) {
      const initials = wt.title.split(/\s+/).map(function(w) { return w[0] || ''; }).join('').slice(0, 2).toUpperCase();
      return '<a class="menu-card" href="/' + esc(wt.id) + '">' +
        '<div class="menu-card-cover">' +
          '<div class="menu-card-cover-ph">' + esc(initials) + '</div>' +
          '<img src="/api/walkthroughs/' + esc(wt.id) + '/cover" alt="" ' +
            'onerror="this.style.display=\'none\'" loading="lazy">' +
        '</div>' +
        '<div class="menu-card-body">' +
          '<div class="menu-card-title">' + esc(wt.title) + '</div>' +
          (wt.description ? '<div class="menu-card-desc">' + esc(wt.description) + '</div>' : '') +
          '<div class="menu-card-meta">' + wt.panels + ' panel' + (wt.panels !== 1 ? 's' : '') + '</div>' +
        '</div>' +
      '</a>';
    }).join('') : '<p style="color:var(--muted);font-size:0.9rem">No walkthroughs available yet.</p>';
    $menuView.classList.add('show');
  } catch(e) {
    showError('Could not load walkthroughs.');
  }
}

// ── Resume-position prompt ─────────────────────────────────────────────────
function showResumePrompt(idx) {
  resumeTarget = idx;
  $resumeMsg.textContent = 'Resume from panel ' + (idx + 1) + '?';
  $resumePrompt.classList.add('visible');
  if (resumeDismissTimer) clearTimeout(resumeDismissTimer);
  resumeDismissTimer = setTimeout(dismissResume, 8000);
}

function dismissResume() {
  $resumePrompt.classList.remove('visible');
  if (resumeDismissTimer) { clearTimeout(resumeDismissTimer); resumeDismissTimer = null; }
}

$resumeYes.addEventListener('click', function() {
  const idx = resumeTarget;
  dismissResume();
  goToPanel(idx);
});
$resumeNo.addEventListener('click', dismissResume);

// ── Init ───────────────────────────────────────────────────────────────────
function showError(msg) {
  $loading.classList.add('gone');
  $errMsg.textContent = msg;
  $errView.classList.add('show');
}

async function init() {
  wid = window.location.pathname.replace(/^\/+|\/+$/g, '');
  if (!wid) {
    $loading.classList.add('gone');
    await showMenu();
    return;
  }

  try {
    const res = await fetch('/api/walkthroughs/' + wid);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    manifest = await res.json();
  } catch(e) {
    showError('Could not load walkthrough "' + wid + '".');
    return;
  }

  document.title = manifest.title;
  $wtTitle.textContent = manifest.title;
  $sbTitle.textContent = manifest.title;
  applyTheme(manifest.theme);
  buildSectionIndex();
  renderNav();
  setupMusic();
  initOfflineBtn(wid); // async, runs in background — don't await
  const savedPos = getSavedPosition(); // read before goToPanel(0) overwrites it
  await goToPanel(0);
  $loading.classList.add('gone');
  if (savedPos > 0 && savedPos < manifest.panels.length) {
    showResumePrompt(savedPos);
  }
}

// ── Cast (Chrome, Default Media Receiver CC1AD845) ─────────────────────────
function initCastApi() {
  const ctx = cast.framework.CastContext.getInstance();
  ctx.setOptions({
    receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
  });

  ctx.addEventListener(
    cast.framework.CastContextEventType.CAST_STATE_CHANGED,
    function(e) {
      castAvailable = e.castState !== cast.framework.CastState.NO_DEVICES_AVAILABLE;
      updateCastBtn();
    }
  );

  ctx.addEventListener(
    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
    function(e) {
      var SS = cast.framework.SessionState;
      if (e.sessionState === SS.SESSION_STARTED || e.sessionState === SS.SESSION_RESUMED) {
        castSession = ctx.getCurrentSession();
        castPlayer  = new cast.framework.RemotePlayer();
        castCtrl    = new cast.framework.RemotePlayerController(castPlayer);
        castCtrl.addEventListener(
          cast.framework.RemotePlayerEventType.PLAYER_STATE_CHANGED,
          function() {
            if (!castPlayer) return;
            var st = castPlayer.playerState;
            if (st === chrome.cast.media.PlayerState.PLAYING) {
              // Only a narration clip counts as "media had"; the hold image must
              // not, or its IDLE would be read as a clip-end and re-show Continue.
              if (!castHolding) castMediaHad = true;
            } else if (st === chrome.cast.media.PlayerState.IDLE) {
              if (castHolding) {
                // DMR drops a still image after its short photo-display interval;
                // re-assert it so the panel picture stays up until the viewer
                // advances or disconnects.
                if (currentIdx >= 0) castHoldImage(currentIdx, panelCache[currentIdx]);
              } else if (castMediaHad) {
                // Narration clip ended — mirror local narration-end, then hold.
                castMediaHad = false;
                setTimeout(showContinue, 600);
                if (currentIdx >= 0) castHoldImage(currentIdx, panelCache[currentIdx]);
              }
            }
          }
        );
        onCastConnected();
      } else if (e.sessionState === cast.framework.SessionState.SESSION_ENDED ||
                 e.sessionState === cast.framework.SessionState.SESSION_START_FAILED) {
        castSession = null; castPlayer = null; castCtrl = null; castMediaHad = false;
        onCastDisconnected();
      }
    }
  );
}

function updateCastBtn() {
  if (!$castBtn) return;
  // The <google-cast-launcher> renders the standard Cast icon and reflects
  // connected/disconnected state itself; we only gate visibility on device
  // availability so it doesn't show when there's nothing to cast to.
  $castBtn.style.display = castAvailable ? '' : 'none';
}

function castPanel(i, data) {
  if (!castSession) return;
  var panelId = manifest.panels[i].id;

  // Use pre-baked cast.mp4 when narration exists; otherwise cast the primary image
  var mediaUrl, contentType;
  if (data.narration) {
    mediaUrl    = '/api/walkthroughs/' + wid + '/asset/' + panelId + '/cast.mp4';
    contentType = 'video/mp4';
  } else {
    var imgFile = (data.images && data.images.length > 0) ? data.images[0] : data.image;
    if (!imgFile) return;
    mediaUrl    = '/api/walkthroughs/' + wid + '/asset/' + panelId + '/' + imgFile;
    contentType = imgFile.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg';
  }

  // Cast receiver needs an absolute URL reachable from the internet
  var absUrl = new URL(mediaUrl, window.location.origin).href;
  var mi     = new chrome.cast.media.MediaInfo(absUrl, contentType);
  var meta   = new chrome.cast.media.GenericMediaMetadata();
  meta.title    = data.title    || '';
  meta.subtitle = data.subtitle || '';
  mi.metadata   = meta;

  var req      = new chrome.cast.media.LoadRequest(mi);
  req.autoplay = true;
  castMediaHad = false;
  castHolding  = false;

  // The baked cast.mp4 holds the still image for minutes after the audio ends
  // (no video→photo switch, no flicker), so the clip no longer ends at narration
  // end — show Continue on a timer instead of waiting for the player to go IDLE.
  if (castContinueTimer) { clearTimeout(castContinueTimer); castContinueTimer = null; }
  if (data.narration) {
    var contMs = (Number(data.narration_duration) || 30) * 1000 + 800;
    castContinueTimer = setTimeout(showContinue, contMs);
  }

  // A TV waking from off (HDMI-CEC) boots its receiver app a few seconds after
  // the session connects, so the first loadMedia can land before it's ready and
  // fail silently. Retry with backoff against the session that's still current.
  var attempts = 0;
  (function attempt() {
    if (!castSession) return; // session ended while waiting
    castSession.loadMedia(req).catch(function(err) {
      attempts++;
      if (attempts <= 4 && castSession) {
        setTimeout(attempt, attempts * 1500);
      } else {
        console.warn('Cast loadMedia failed after retries:', err);
      }
    });
  })();
}

// After a narration clip ends the DMR reverts to the Chromecast idle splash,
// losing the panel picture. Re-load the panel's still image so the TV keeps
// showing it while the viewer decides to advance. The DMR only displays a still
// for a short interval, so the player-state handler re-asserts it on IDLE while
// castHolding is set — keeping the picture up until advance or disconnect.
function castHoldImage(i, data) {
  if (!castSession || !data) return;
  var imgFile = (data.images && data.images.length > 0) ? data.images[0] : data.image;
  if (!imgFile) return;
  castHolding = true;
  var panelId = manifest.panels[i].id;
  var mediaUrl = '/api/walkthroughs/' + wid + '/asset/' + panelId + '/' + imgFile;
  var contentType = imgFile.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg';
  var absUrl = new URL(mediaUrl, window.location.origin).href;
  var mi = new chrome.cast.media.MediaInfo(absUrl, contentType);
  var meta = new chrome.cast.media.GenericMediaMetadata();
  meta.title = data.title || ''; meta.subtitle = data.subtitle || '';
  mi.metadata = meta;
  var req = new chrome.cast.media.LoadRequest(mi);
  req.autoplay = true;
  castSession.loadMedia(req).catch(function(err) {
    console.warn('Cast hold-image failed:', err);
  });
}

function onCastConnected() {
  updateCastBtn();
  stopNarration(); // stop local audio immediately
  if (currentIdx >= 0 && manifest) {
    var data = panelCache[currentIdx];
    if (data) {
      // Re-show controls so phone can drive the cast player
      if (data.narration) {
        $narLabel.textContent = data.title || '';
        $narPauseBtn.textContent = '⏸';
        $narPauseBtn.style.display = '';
        $narRestartBtn.style.display = '';
      }
      castPanel(currentIdx, data);
    }
  }
}

function onCastDisconnected() {
  updateCastBtn();
  castHolding = false;
  // Return to the phone paused at the current panel — don't auto-read aloud.
  if (currentIdx >= 0 && manifest) {
    var pv   = $stage.querySelector('.panel-view.active');
    var data = panelCache[currentIdx];
    if (pv && data) playNarration(pv, currentIdx, data, true);
  }
}

// The <google-cast-launcher> element handles the connect/disconnect dialog and
// icon state itself — no custom click handler needed (one would double-fire
// requestSession and desync from the SDK's true session state).

registerSW(); // Start early, independent of walkthrough init
init().catch(function(e) {
  console.error(e);
  showError('An unexpected error occurred. Check the browser console.');
});
</script>
